version = 1

[[annotations]]
path = ["docs/**", "**/*.md", "AUTHORS", "CONTRIBUTORS", ".mailmap", "**/.gitignore", ".gitmodules", "REUSE.toml", "flake.lock"]
SPDX-FileCopyrightText = "2026 The RadioFoundry Authors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["platform/stm32f4/stm32f4xx_hal_conf.h", "platform/stm32f4/LICENSE-STM32F4xx-HAL.txt"]
SPDX-FileCopyrightText = "2017 STMicroelectronics"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = ["site/templates/**", "site/**/*.json", "site/**/*.png", "site/**/*.svg"]
SPDX-FileCopyrightText = "2026 The RadioFoundry Authors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["stub/*.bin"]
SPDX-FileCopyrightText = "2026 The RadioFoundry Authors"
SPDX-License-Identifier = "MIT"

# Data with no room for a comment: the test voice set (synthesized speech, tests/data/voice/README.md), test vectors,
# the codec maps and the generated board registry, the CI proxy's allow list, and the web page served from flash
# (a comment there would cost flash)
[[annotations]]
path = ["tests/data/voice/**", "tests/host/data/**", "tools/rfoundry/rfoundry/codec_maps/**",
        "tools/rfoundry/rfoundry/registry.json", "tools/rfoundry/tests/*.json", "tools/ci-runner/proxy/allow",
        "core/net/http_assets/index.html"]
SPDX-FileCopyrightText = "2026 The RadioFoundry Authors"
SPDX-License-Identifier = "MIT"

# Tom Select, copied unchanged from its npm package (site/static/vendor/tom-select/README.md)
[[annotations]]
path = ["site/static/vendor/tom-select/tom-select.complete.min.js", "site/static/vendor/tom-select/tom-select.default.css"]
SPDX-FileCopyrightText = "2013-2026 Tom Select contributors"
SPDX-License-Identifier = "Apache-2.0"

# Codec 2's quantizer tables: the file is ours and MIT; its LSP levels are values from the Codec 2 reference
# implementation (LGPL 2.1), taken by decision of the RadioFoundry maintainer (2026-11-22), not under a separate grant
# from the Codec 2 authors; no code was taken (core/codec2/THIRD_PARTY, docs/CLEANROOM.md)
[[annotations]]
path = ["core/codec2/c2_tab.c"]
precedence = "aggregate"
SPDX-FileCopyrightText = "LSP quantizer level values: the Codec 2 authors"
SPDX-License-Identifier = "MIT"

# The encoder's tables: the file is ours and MIT; its pitch estimator low-pass taps are values from the Codec 2
# reference implementation (LGPL 2.1), taken by decision of the RadioFoundry maintainer (2026-11-22), not under a
# separate grant from the Codec 2 authors; no code was taken (core/codec2/THIRD_PARTY, docs/CLEANROOM.md)
[[annotations]]
path = ["core/codec2/c2_enc_tab.c"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Pitch estimator low-pass tap values: the Codec 2 authors"
SPDX-License-Identifier = "MIT"
